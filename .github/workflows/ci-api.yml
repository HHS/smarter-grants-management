name: API Checks

on:
  workflow_call:
    inputs:
      skip_checks:
        type: boolean
        default: false
        description: Skip the guts of this workflow, but we have to run the workflow for dependency reasons when calling from CD workflows
  pull_request:

defaults:
  run:
    working-directory: ./api

jobs:
  changes:
    name: Check for API changes
    runs-on: ubuntu-22.04
    outputs:
      api: ${{ steps.changed-api-files.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Get changed API files
        id: changed-api-files
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: |
            api/**
            .github/workflows/ci-api.yml

  lint-test:
    needs: changes
    if: ${{ (inputs.skip_checks == null || inputs.skip_checks == false) && (github.event_name != 'pull_request' || needs.changes.outputs.api == 'true') }}
    name: API Lint, Format & Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Initialize the docker containers
        run: make init

      - name: Run format check
        run: make format-check

      - name: Run linting
        run: make lint

      - name: Check migrations up-to-date
        run: make db-check-migrations

      - name: Run security linting
        run: make lint-security

      - name: Start tests
        run: make test-coverage

  skip-checks:
    needs: changes
    if: ${{ (inputs.skip_checks != null && inputs.skip_checks == true) || (github.event_name == 'pull_request' && needs.changes.outputs.api != 'true') }}
    name: Skip Checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checks skipped
        working-directory: ./
        run: exit 0
