<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">E2E auth flow local vs staging</title>
  <desc id="desc">Diagram showing the Playwright E2E authentication flow for local and staging environments.</desc>

  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .label { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .small { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #374151; }
      .box { fill: #f8fafc; stroke: #1f2937; stroke-width: 2; rx: 16; }
      .decision { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 16; }
      .local { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 16; }
      .staging { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 16; }
      .arrow { stroke: #374151; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .branch { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .highlight { fill: #fef3c7; stroke: #eab308; stroke-width: 2; rx: 12; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#374151" />
    </marker>
  </defs>

  <rect width="1400" height="820" fill="#ffffff"/>

  <text x="700" y="46" text-anchor="middle" class="title">Playwright E2E auth flow</text>

  <rect x="600" y="90" width="200" height="78" class="box"/>
  <text x="700" y="122" text-anchor="middle" class="label">Spec calls</text>
  <text x="700" y="145" text-anchor="middle" class="label">authenticateE2eUser</text>

  <rect x="540" y="220" width="320" height="92" class="decision"/>
  <text x="700" y="255" text-anchor="middle" class="label">PLAYWRIGHT_TARGET_ENV</text>
  <text x="700" y="279" text-anchor="middle" class="label">local or staging?</text>

  <path d="M700 168 L700 220" class="arrow"/>

  <!-- LOCAL path -->
  <rect x="90" y="390" width="440" height="110" class="local"/>
  <text x="310" y="430" text-anchor="middle" class="label">LOCAL flow</text>
  <text x="310" y="456" text-anchor="middle" class="small">Fetch JWT from /v1/internal/api-jwt</text>
  <text x="310" y="478" text-anchor="middle" class="small">Create spoofed session cookie</text>

  <rect x="90" y="560" width="440" height="110" class="local"/>
  <text x="310" y="600" text-anchor="middle" class="label">Open app</text>
  <text x="310" y="626" text-anchor="middle" class="small">Run test as signed-in local user</text>

  <!-- STAGING path -->
  <rect x="870" y="390" width="440" height="155" class="staging"/>
  <text x="1090" y="430" text-anchor="middle" class="label">STAGING flow</text>
  <text x="1090" y="456" text-anchor="middle" class="small">Open deployed frontend</text>
  <text x="1090" y="480" text-anchor="middle" class="small">Click Sign in</text>
  <text x="1090" y="504" text-anchor="middle" class="small">Fill API key in modal</text>

  <rect x="870" y="600" width="440" height="110" class="staging"/>
  <text x="1090" y="640" text-anchor="middle" class="label">Authenticated state</text>
  <text x="1090" y="666" text-anchor="middle" class="small">Continue testing with real staging login</text>

  <path d="M540 266 L310 266 L310 390" class="branch"/>
  <path d="M860 266 L1090 266 L1090 390" class="branch"/>

  <path d="M310 500 L310 560" class="arrow"/>
  <path d="M1090 545 L1090 600" class="arrow"/>

  <rect x="490" y="332" width="150" height="42" class="highlight"/>
  <text x="565" y="358" text-anchor="middle" class="small">if local</text>

  <rect x="760" y="332" width="170" height="42" class="highlight"/>
  <text x="845" y="358" text-anchor="middle" class="small">if staging</text>

  <text x="700" y="760" text-anchor="middle" class="small">Decision point lives in frontend/tests/e2e/utils/auth/authenticate-e2e-user-utils.ts</text>
</svg>
