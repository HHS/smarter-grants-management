services:

  grants-management-api:
    build:
      context: .
      target: dev
      args:
        - RUN_UID=${RUN_UID:-4000}
        - RUN_USER=${RUN_USER:-api}
    command:
      [
        "flask", "--app", "src.app", "run", "--host", "0.0.0.0", "--port", "8089", "--reload"
      ]
    container_name: grants-management-api
    env_file:
      - path: ./local.env
        required: true
      - path: ./override.env
        required: false
    depends_on:
      - mock-oauth2-server
      - grants-mgmt-db
      - mgmt-sqsmock
    ports:
      - 8089:8089
    volumes:
      - .:/grants_management_api
    networks:
      - default

  grants-mgmt-db:
    image: postgres:17.5-alpine
    container_name: grants-mgmt-db
    command: postgres -c "log_lock_waits=on" -N 1000 -c "fsync=off"
    environment:
      POSTGRES_USER: grants_management
      POSTGRES_PASSWORD: secret123
    ports:
      # NOTE - we map the port differently as it's common our developers
      # will do work in the simpler-grants code as well which uses the default 5432 port
      - "5439:5432"
    volumes:
      - grantsmgmtdbdata:/var/lib/postgresql/data
    networks:
      - default

  # NOTE - the service is named differently from simpler-grants' `sqsmock` on
  # purpose. Both repos' compose files sit in a directory named `api`, so they
  # share a compose project, and same-named services replace each other.
  mgmt-sqsmock:
    image: softwaremill/elasticmq-native
    container_name: grants-mgmt-sqsmock
    ports:
      # NOTE - we map the port differently as it's possible our developers
      # will do work in the simpler-grants code as well which uses the default 9324 port
      - "9325:9324"
    volumes:
      - ./mock-sqs/custom.conf:/opt/elasticmq.conf
    networks:
      - default

  # Dev image + graphviz, used only to generate the OpenAPI spec and ERD
  # diagrams (`make openapi-spec` / `make create-erds`). Profile-gated so it
  # doesn't start with the normal stack, and on the default network only since
  # doc generation reads SQLAlchemy metadata and needs no DB.
  mgmt-openapi-tools:
    profiles:
      - mgmt-openapi-tools
    build:
      context: .
      target: mgmt-openapi-tools
      args:
        - RUN_UID=${RUN_UID:-4000}
        - RUN_USER=${RUN_USER:-api}
    env_file:
      - path: ./local.env
        required: true
      - path: ./override.env
        required: false
    volumes:
      - .:/grants_management_api
    networks:
      - default

  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:2.3.0
    ports:
      - "5008:5008"
    environment:
      LOG_LEVEL: "debug"
      SERVER_PORT: 5008
      JSON_CONFIG_PATH: /app/config.json
    networks:
      - default
    volumes:
      - ./mock-oauth/config.json:/app/config.json
      - ./mock-oauth/mock-server-key.json:/app/resources/mock-oauth2-server-keys.json


volumes:
    grantsmgmtdbdata:

