          description: Validation error
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseSchema'
          description: Authentication error
      tags:
      - Assistance Listing
      summary: Assistance Listing Search
      description: '

        The query parameter of this endpoint supports a few basic search operations
        which

        query against the assistance listing number and program title.


        For querying against the assistance listing number, it automatically handles
        prefixing,

        and searching for `12.` will return all assistance listings that begin with
        ''12.''.


        For querying against the program title, there are a few options you have for
        querying:


        * `chemistry` will search for program titles with the word chemistry

        * `chem*` will search for words that begin with ''chem'' including chemistry
        and chemical

        * `chemistry disease` will search for program titles that contain both words

        * `chemistry OR disease` will search for program titles that contain either
        word

        * `-chemistry` will search for program titles that don''t contain chemistry


        These can be mix and matched like:

        * `chem* -act` which will get everything that starts with chem but doesn''t
        contain act

        '
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistanceListingSearchRequestSchema'
      security:
