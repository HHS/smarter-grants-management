info:
  description: '

    Back end API for Grants Management.


    This API is in early development, and is not yet ready for public use.

    '
  contact:
    name: Grants Management
    url: https://simpler.grants.gov/
    email: simpler@grants.gov
  title: Grants Management API
  version: v0
tags:
- name: Health
- name: User v1 - Internal Only
- name: Proof of Concept - Alpha
- name: Workflow
- name: Partners
- name: Grantor Organizations
- name: Resources
- name: Opportunities
- name: Files
- name: LOCAL ONLY
servers: .
paths:
  /health:
    get:
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthcheckResponseSchema'
          description: Successful response
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseSchema'
          description: Service Unavailable
      tags:
      - Health
      summary: Healthcheck endpoint - verifies database can be connected to and returns
        deploy metadata.
  /v1/files:
    post:
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePresignedUploadResponseSchema'
          description: Successful response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseSchema'
          description: Validation error
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseSchema'
          description: Authentication error
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseSchema'
          description: Too Many Requests
      tags:
      - Files
      summary: Create a presigned upload URL
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePresignedUploadRequestSchema'
      security:
      - ApiJwtAuth: &id001 []
      - ApiUserKeyAuth: *id001
  /v1/users/login:
    get:
      parameters:
      - in: query
        name: piv_required
        description: Whether the user is required to use a PIV to login
        schema:
          type: boolean
          nullable: true
        required: false
      responses:
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseSchema'
          description: Validation error
        '302':
          content:
            application/json:
              schema: {}
          description: Found
      tags:
      - User v1 - Internal Only
      summary: User Login
      description: '

        To use this endpoint, click [this link](/v1/users/login) which will redirect

        you to an OAuth provider where you can sign into an account.


        Do not try to use the execute option below as OpenAPI will not redirect your
        browser for you.


        The token you receive can then be set to the X-MGMT-Token header for authenticating
        with endpoints.

        '
  /v1/users/logout:
    get:
      parameters: []
      responses:
        '302':
          content:
            application/json:
              schema: {}
          description: Found
      tags:
      - User v1 - Internal Only
      summary: User Logout
      description: '

        To use this endpoint, click [this link](/v1/users/logout) which will redirect
        you

        to an OAuth provider where you can logout of your account in both our system
        and

        the OAuth system.

        '
  /v1/opportunities:
    post:
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityResponseSchema'
          description: Successful response
        '422':
