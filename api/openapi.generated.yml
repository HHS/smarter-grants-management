          minItems: 1
          description: Types of applicants eligible for this announcement
          example: *id039
          items:
            enum: *id040
            type: *id041
        applicant_eligibility_description:
          type:
          - string
          - 'null'
          maxLength: 4000
          description: Additional information about the types of applicants that are
            eligible
          example: All types of domestic applicants are eligible to apply
        agency_contact_description:
          type:
          - string
          - 'null'
          maxLength: 1000
          description: Information regarding contacting the agency who owns the announcement
          example: For more information, reach out to Jane Smith at agency US-ABC
        agency_email_address:
          type:
          - string
          - 'null'
          maxLength: 130
          description: The contact email of the agency who owns the announcement
          example: fake_email@grants.gov
        agency_email_address_description:
          type:
          - string
          - 'null'
          maxLength: 108
          description: The text for the link to the agency email address
          example: Click me to email the agency
      required:
      - agency_contact_description
      - agency_email_address
      - agency_email_address_description
      - applicant_types
      - award_ceiling
      - award_floor
      - funding_categories
      - funding_instruments
      - is_cost_sharing
      - post_timestamp
      - summary_description
    AnnouncementAttachmentDeleteResponseSchema:
      type: object
      properties:
        message:
          type: string
          description: The message to return
          example: Success
        data:
          example: null
        status_code:
          type: integer
          description: The HTTP status code
          example: 200
    ApplicationPackageUpdateRequestSchema:
      type: object
      properties:
        application_package_title:
          type: string
          description: The title of the application package
          example: Proposal for Advanced Research
        public_application_package_id:
          type: string
          description: The public-facing identifier of the application package
          example: ABC-123-456
        opening_timestamp:
          type:
          - string
          - 'null'
          format: date-time
          description: The opening date of the application package, the first day
            applications are accepted
        closing_timestamp:
          type:
          - string
          - 'null'
          format: date-time
          description: The closing date of the application package, the last day applications
            are accepted
        grace_period:
          type:
          - integer
          - 'null'
          minimum: 0
          description: The number of days after the closing date that applications
            are still accepted
          example: 5
        contact_info:
          type:
          - string
          - 'null'
          description: Contact info getting assistance with the application package
          example: 'Bob Smith

            FakeMail@fake.com'
        open_to_applicants:
          type: array
          minItems: 1
          description: List of applicant types who are eligible for this application
            package
          example: *id042
          items:
            enum: *id043
            type: *id044
      required:
      - application_package_title
      - closing_timestamp
      - contact_info
      - open_to_applicants
      - opening_timestamp
    FormReplaceSchema:
      type: object
      properties:
        form_id:
          type: integer
          description: The primary key ID of the form
        is_required:
          type: boolean
          description: Whether the form is required
      required:
      - form_id
      - is_required
    ApplicationPackageFormsSetRequestSchema:
      type: object
      properties:
        forms:
          type: array
          minItems: 1
          description: List of forms to set on the application package
          items:
            type:
            - object
            $ref: '#/components/schemas/FormReplaceSchema'
      required:
      - forms
  securitySchemes:
    ApiJwtAuth:
      type: apiKey
      in: header
      name: X-MGMT-Token
    ApiUserKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

